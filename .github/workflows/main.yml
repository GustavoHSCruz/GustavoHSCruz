name: WakaTime stats

on:
  workflow_dispatch:
  schedule:
    - cron: '0 0 * * 0' # Sundays

permissions:
  contents: write

jobs:
  update-readme:
    name: Update README with WakaTime stats
    runs-on: ubuntu-latest
    steps:
      - uses: athul/waka-readme@v0.3.1
        with:
          WAKATIME_API_KEY: ${{ secrets.WAKATIME_API_KEY }}
          TIME_RANGE: last_7_days
          LANG_COUNT: 6
          SHOW_TOTAL: true
          COMMIT_MESSAGE: 'chore: update WakaTime stats'
