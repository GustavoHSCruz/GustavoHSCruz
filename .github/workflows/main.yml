name: WakaTime card

on:
  workflow_dispatch:
  schedule:
    - cron: '0 0 * * 0' # Sundays

permissions:
  contents: write

jobs:
  update-card:
    name: Redraw the WakaTime card
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Draw card
        env:
          WAKATIME_API_KEY: ${{ secrets.WAKATIME_API_KEY }}
        run: python3 .github/scripts/waka_card.py

      - name: Commit if changed
        run: |
          git add assets/waka-*.svg
          git diff --cached --quiet && exit 0
          git config user.name "github-actions[bot]"
          git config user.email "41898233+github-actions[bot]@users.noreply.github.com"
          git commit -m "chore: update WakaTime card"
          git push
